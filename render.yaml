# Render Blueprint: New + > Blueprint > pick this repo. Render reads this file.
# You will be asked for the two `sync: false` secrets (DATABASE_URL, LLM_API_KEY).
services:
  - type: web
    name: autoform-shreya
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python training/train.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Postgres connection string (e.g. a free Neon or Supabase database).
      # Without it the app falls back to SQLite, which Render wipes on every deploy.
      - key: DATABASE_URL
        sync: false
      # Hosted LLM used for written-answer drafts (any OpenAI-compatible API).
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_MAX_TOKENS_EXTRA
        value: "200"
      - key: LLM_API_KEY
        sync: false
      - key: GENERATE_LIMIT_PER_HOUR
        value: "30"
